<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ingliz tili daraja testi</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f6f7fb);
    --fg: var(--tg-theme-text-color, #14171f);
    --hint: var(--tg-theme-hint-color, #7a8194);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --accent: var(--tg-theme-button-color, #3b82f6);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--fg) 12%, transparent);
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh;
         padding-bottom: env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--hint); }
  main { max-width: 560px; margin: 0 auto; padding: 8px 16px 32px; animation: in .22s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
          box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  h1 { font-size: 26px; line-height: 1.2; margin: 6px 0 14px; }
  .tag { display: inline-block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
         color: var(--accent); margin-bottom: 8px; }
  .q { font-size: 22px; line-height: 1.35; font-weight: 650; margin: 0; }
  .opts { display: grid; gap: 10px; margin-top: 4px; }
  .opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; font: inherit;
         padding: 15px 16px; min-height: 56px; background: var(--card); color: var(--fg);
         border: 2px solid var(--line); border-radius: var(--radius); cursor: pointer; transition: transform .08s, border-color .1s; }
  .opt:active, .opt.pick { border-color: var(--accent); transform: scale(.985); }
  .opt .ch { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
             font-size: 14px; font-weight: 700; background: var(--line); color: var(--hint); }
  .opt.pick .ch { background: var(--accent); color: var(--accent-fg); }
  .skip { display: block; width: 100%; margin-top: 14px; padding: 14px; font: inherit; font-size: 16px;
          color: var(--hint); background: none; border: 2px dashed var(--line); border-radius: var(--radius); cursor: pointer; }
  .primary { display: block; width: 100%; padding: 17px; margin-top: 8px; background: var(--accent); color: var(--accent-fg);
             border: 0; border-radius: var(--radius); font: inherit; font-weight: 650; font-size: 18px; cursor: pointer; }
  .primary:active { transform: scale(.985); }
  p { margin: 0 0 12px; } .hint { color: var(--hint); font-size: 15px; }
  .passage { font-size: 17px; line-height: 1.6; }
  details summary { cursor: pointer; color: var(--accent); font-size: 15px; margin-bottom: 4px; }
  textarea { width: 100%; min-height: 180px; padding: 14px; font: inherit; color: var(--fg); background: var(--card);
             border: 2px solid var(--line); border-radius: var(--radius); resize: vertical; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .count { text-align: right; font-size: 13px; color: var(--hint); margin: 4px 2px 12px; }
  .done { text-align: center; padding: 48px 8px; } .done .big { font-size: 56px; }
</style>
</head>
<body>
<header><div class="bar"><i id="prog"></i></div><div class="meta"><span id="where"></span><span id="clock">0:00</span></div></header>
<main id="view"></main>
<script>
const DATA = {"g": [{"q": "She ___ a teacher.", "o": ["am", "is", "are", "be"]}, {"q": "___ you like coffee?", "o": ["Do", "Does", "Are", "Is"]}, {"q": "He can't ___ Chinese.", "o": ["speaks", "speak", "speaking", "spoke"]}, {"q": "Look! It ___ outside.", "o": ["rains", "rain", "is raining", "rained"]}, {"q": "I ___ TV when the phone rang.", "o": ["watch", "watched", "was watching", "am watching"]}, {"q": "There isn't ___ milk in the fridge.", "o": ["any", "some", "a", "many"]}, {"q": "I've lived here ___ 2015.", "o": ["for", "since", "during", "ago"]}, {"q": "If it rains tomorrow, we ___ the match.", "o": ["cancel", "will cancel", "cancelled", "would cancel"]}, {"q": "By the time we arrived, the film ___.", "o": ["already started", "has already started", "had already started", "already starts"]}, {"q": "She suggested ___ a different hotel.", "o": ["to book", "booking", "book", "booked"]}, {"q": "I wish I ___ more time to travel.", "o": ["have", "had", "will have", "has"]}, {"q": "___ she studied harder, she would have passed.", "o": ["If", "Unless", "Had", "Should"]}, {"q": "No sooner ___ home than the phone rang.", "o": ["I got", "had I got", "did I get", "I had got"]}, {"q": "The project, ___ took two years, was finally finished.", "o": ["that", "it", "which", "what"]}, {"q": "Despite ___ tired, she kept working.", "o": ["being", "be", "to be", "she was"]}, {"q": "Hardly ___ the meeting started when the fire alarm rang.", "o": ["had", "has", "did", "was"]}, {"q": "The committee's decision is ___ to change.", "o": ["subject", "object", "exposed", "related"]}, {"q": "She has a ___ for detail that makes her an excellent editor.", "o": ["knack", "keen", "skill", "flair"]}, {"q": "Only after the results were announced ___ how close the race had been.", "o": ["we realized", "did we realize", "we did realize", "had we realized"]}, {"q": "Rarely ___ such a compelling case been made for reform.", "o": ["has", "had", "did", "was"]}], "r": [{"q": "What time does Maria wake up?", "o": ["6:00", "6:30", "7:00", "9:00"]}, {"q": "Why does Maria like her job?", "o": ["It pays well", "Her colleagues are friendly", "It's close to the park", "She works from home"]}, {"q": "What does Maria do on Fridays?", "o": ["Works late", "Goes to the park", "Has lunch with colleagues", "Reads at the office"]}], "block": 4, "passage": "Maria works in a small office in the city centre. Every morning she wakes up at half past six, has breakfast, and takes the bus to work. She usually arrives at the office before nine o'clock. Maria likes her job because her colleagues are friendly and the office is not far from her home. On Fridays, she and her colleagues often go for lunch together at a small restaurant near the office. After work, Maria likes to relax by reading a book or going for a walk in the park.", "topics": ["Write a short paragraph (5-8 sentences) introducing yourself: your name, where you are from, your job or studies, and your hobbies.", "Describe your typical day, from morning to evening.", "Write about a memorable trip or holiday you have taken. What happened and why was it memorable?", "Discuss the advantages and disadvantages of learning English online versus in a classroom. Give your opinion."]};
const $ = (id) => document.getElementById(id);
const view = $("view");
const t0 = Date.now();
setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000);
  $("clock").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }, 1000);

const NG = DATA.g.length, NR = DATA.r.length, TOTAL = NG + NR + 1, BLOCK = DATA.block || 4;
let gAns = [], rAns = [], gi = 0, ri = 0, topic = 0;
const order = (n) => [...Array(n).keys()].sort(() => Math.random() - .5);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const progress = (done, label) => { $("prog").style.width = (100 * done / TOTAL) + "%"; $("where").textContent = label; };
const render = (html) => { view.style.animation = "none"; void view.offsetWidth; view.style.animation = ""; view.innerHTML = html; window.scrollTo(0, 0); };
const options = (item) => `<div class="opts">` + order(item.o.length).map((i, pos) =>
  `<button class="opt" data-i="${i}"><span class="ch">${"ABCD"[pos]}</span><span>${esc(item.o[i])}</span></button>`).join("") + `</div>
  <button class="skip" data-i="-1">Bilmayman</button>`;
function bind(onPick) {
  view.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => {
    b.classList.add("pick");
    setTimeout(() => onPick(parseInt(b.dataset.i, 10)), 140);
  }));
}

function intro() {
  progress(0, "");
  render(`<div class="card"><span class="tag">Daraja testi</span><h1>Ingliz tili darajangizni aniqlaymiz</h1>
    <p>Grammatika va lug'at (20 tagacha savol), o'qish (3 savol) va ixtiyoriy yozma topshiriq. Taxminan 8 daqiqa.</p>
    <p>Savollar osondan qiyinga boradi. Oxirgilari qiyin bo'lishi tabiiy.</p>
    <p class="hint"><b>Bilmasangiz, taxmin qilmang.</b> «Bilmayman» tugmasini bosing, natija aniqroq chiqadi. Telefon yoki lug'atdan foydalanmang.</p></div>
    <button class="primary" id="go">Boshlash</button>`);
  $("go").onclick = showGrammar;
}

function showGrammar() {
  if (gi >= NG) return showReadingIntro();
  const item = DATA.g[gi];
  progress(gi, `Grammatika ${gi + 1}/${NG}`);
  render(`<div class="card"><span class="tag">Savol ${gi + 1}</span><p class="q">${esc(item.q)}</p></div>${options(item)}`);
  bind((v) => {
    gAns[gi] = v; gi++;
    if (gi % BLOCK === 0 && gAns.slice(gi - BLOCK, gi).filter((x) => x === -1).length >= 2) {
      for (let k = gi; k < NG; k++) gAns[k] = -1;
      gi = NG;
    }
    showGrammar();
  });
}

function showReadingIntro() {
  progress(NG, "O'qish");
  render(`<div class="card"><span class="tag">O'qish</span><p class="passage">${esc(DATA.passage)}</p></div>
    <p class="hint">Matnni o'qing, so'ng savollarga javob bering. Matn savollar paytida ham ko'rinib turadi.</p>
    <button class="primary" id="go">Savollarga o'tish</button>`);
  $("go").onclick = showReading;
}
function showReading() {
  if (ri >= NR) return showWriting();
  const item = DATA.r[ri];
  progress(NG + ri, `O'qish ${ri + 1}/${NR}`);
  render(`<div class="card"><details><summary>Matnni ko'rish</summary><p class="passage">${esc(DATA.passage)}</p></details>
    <span class="tag">Savol ${ri + 1}</span><p class="q">${esc(item.q)}</p></div>${options(item)}`);
  bind((v) => { rAns[ri] = v; ri++; showReading(); });
}

function showWriting() {
  progress(NG + NR, "Yozish");
  render(`<div class="card"><span class="tag">Yozma topshiriq (ixtiyoriy)</span>
    <p>Bitta mavzuni tanlang va inglizcha yozing:</p>
    <div class="opts" id="topics">${DATA.topics.map((t, i) =>
      `<button class="opt ${i === topic ? "pick" : ""}" data-t="${i}"><span class="ch">${i + 1}</span><span>${esc(t)}</span></button>`).join("")}</div></div>
    <textarea id="w" maxlength="1200" placeholder="Write here in English..."></textarea>
    <div class="count" id="cnt">0 / 1200</div>
    <button class="primary" id="done">Yakunlash</button>
    <p class="hint" style="margin-top:12px">Yozmasangiz ham bo'ladi, lekin yozsangiz o'qituvchi darajangizni aniqroq baholaydi.</p>`);
  view.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => {
    topic = parseInt(b.dataset.t, 10);
    view.querySelectorAll("[data-t]").forEach((x) => x.classList.toggle("pick", x === b));
  }));
  $("w").oninput = () => ($("cnt").textContent = $("w").value.length + " / 1200");
  $("done").onclick = finish;
}

function finish() {
  const w = ($("w") && $("w").value.trim()) || "";
  const payload = { g: gAns, r: rAns, w: w ? `[Topic ${topic + 1}] ${w}` : "", t: Math.floor((Date.now() - t0) / 1000) };
  progress(TOTAL, "Tayyor");
  // Keyboard-button launches have NO initData, so detect Telegram by platform instead.
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.platform && tg.platform !== "unknown") {
    render(`<div class="done"><div class="big">✅</div><h1>Rahmat!</h1><p>Natijalar yuborilmoqda...</p></div>`);
    tg.sendData(JSON.stringify(payload));  // delivers to the bot and closes the Mini App
  } else {
    render(`<div class="done"><div class="big">📱</div><h1>Testni Telegram orqali oching</h1>
      <p class="hint">Natija botga yuborilishi uchun testni bot ichidagi «📝 Testni boshlash» tugmasi orqali oching.</p></div>`);
  }
}

const tgw = window.Telegram && window.Telegram.WebApp;
if (tgw) { try { tgw.ready(); tgw.expand(); } catch (e) {} }
const h = location.hash;  // debug jumps: #g, #r, #w
if (h === "#g") { gi = 5; showGrammar(); } else if (h === "#r") showReadingIntro(); else if (h === "#w") showWriting(); else intro();
// Telegram script is async: re-run ready/expand once it arrives.
window.addEventListener("load", () => { const t = window.Telegram && window.Telegram.WebApp; if (t) { try { t.ready(); t.expand(); } catch (e) {} } });
</script>
</body>
</html>
